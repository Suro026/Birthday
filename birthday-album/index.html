<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A Book of Memories</title>
  <meta name="description" content="A birthday album.">
  <meta name="theme-color" content="#0f0d0c">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:,">

  <!-- Editorial type. Falls back to system serif/sans if offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body data-view="gate">

  <noscript>
    <p class="noscript">This album needs JavaScript to turn its pages.</p>
  </noscript>

  <!-- ===== Opening screen: the cover of the book ===== -->
  <main class="gate screen" id="gate" aria-labelledby="cover-name">
    <div class="cover">
      <div class="cover__inner">
        <p class="eyebrow cover__eyebrow" data-bind="cover.eyebrow"></p>

        <div class="cover__title">
          <p class="cover__lead" data-bind="cover.lead"></p>
          <h1 class="cover__name" id="cover-name" data-bind="recipient.name"></h1>
          <span class="rule" aria-hidden="true"></span>
        </div>

        <div class="cover__actions">
          <button class="btn" id="open-btn" type="button">
            <span data-bind="cover.button">Open the album</span>
          </button>
          <p class="cover__hint" data-bind="cover.hint"></p>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== The album ===== -->
  <div class="album screen" id="album" inert>
    <header class="album__bar">
      <p class="album__title" id="album-title"></p>

      <div class="album__tools">
        <button class="icon-btn" id="sound-btn" type="button" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/>
            <path class="icon-wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
            <path class="icon-slash" d="M16 9.5l5 5M21 9.5l-5 5"/>
          </svg>
        </button>
        <button class="icon-btn" id="close-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>

      <span class="progress" id="progress" aria-hidden="true"></span>
    </header>

    <!-- Leaves (pages) are generated from the configuration by script.js
         and inserted into .book, beneath the two edge hot-spots. -->
    <div class="stage" id="stage" tabindex="-1" role="region">
      <div class="book" id="book">
        <span class="book__block" aria-hidden="true"></span>
        <!-- Soft light drifting across the pages (above the leaves, below the hot-spots) -->
        <span class="fx-light" aria-hidden="true"><span class="fx-light__follow" id="light-follow"><span class="fx-light__blob"></span></span></span>
        <span class="hotspot hotspot--prev" id="hot-prev" data-dir="prev" aria-hidden="true"></span>
        <span class="hotspot hotspot--next" id="hot-next" data-dir="next" aria-hidden="true"></span>
      </div>
      <!-- Film grain over the whole stage -->
      <span class="fx-grain" aria-hidden="true"></span>
    </div>

    <nav class="album__nav" aria-label="Pages">
      <button class="nav-btn nav-btn--prev" id="prev-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        <span class="nav-btn__label" data-bind="ui.previous">Previous</span>
      </button>

      <p class="counter" id="counter">
        <span class="counter__current" id="counter-current">01</span>
        <span class="counter__sep" aria-hidden="true">/</span>
        <span class="counter__total" id="counter-total">01</span>
      </p>

      <button class="nav-btn nav-btn--next" id="next-btn" type="button">
        <span class="nav-btn__label" data-bind="ui.next">Next</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </nav>

    <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
